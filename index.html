<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riscos e Capital — meutudo</title>
<style>
:root{--black:#000000;--white:#FFFFFF;--pink:#E0007A;--pink-d:#B3005F;--pink-l:#FFE6F3;--green:#00A86B;--red:#E53935;--yellow:#F59E0B;--blue:#1D6FE8;--g1:#F8F8F8;--g2:#EFEFEF;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--g1);color:#111;min-height:100vh;}
.topbar{background:var(--black);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:200;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.logo-wrap{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#000;flex-shrink:0;}
.logo-wrap img{width:100%;height:100%;object-fit:contain;}
.topbar-title{color:#fff;font-size:17px;font-weight:700;line-height:1.2;}
.topbar-sub{color:#aaa;font-size:12px;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.topbar-date{color:#888;font-size:13px;display:flex;align-items:center;gap:6px;}
.topbar-date::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pink);display:inline-block;}
.btn-new{background:var(--pink);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-new:hover{background:var(--pink-d);}
.kpi-bar{background:#fff;padding:18px 24px;display:flex;gap:0;border-bottom:1px solid var(--g2);}
.kpi{flex:1;text-align:center;padding:0 12px;border-right:1px solid var(--g2);}
.kpi:last-child{border-right:none;}
.kpi-val{font-size:32px;font-weight:800;line-height:1;}
.kpi-lbl{font-size:10px;font-weight:600;letter-spacing:.08em;color:#888;margin-top:4px;text-transform:uppercase;}
.kpi-val.total{color:#111;}.kpi-val.andamento{color:var(--pink);}.kpi-val.atrasadas{color:var(--red);}.kpi-val.hoje{color:var(--yellow);}.kpi-val.concluidas{color:var(--green);}
.main{padding:20px 24px;max-width:1100px;margin:0 auto;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:#888;margin-bottom:18px;}
.breadcrumb span{cursor:pointer;transition:color .12s;}.breadcrumb span:hover{color:var(--pink);}.breadcrumb span.active{color:#111;font-weight:600;cursor:default;}.breadcrumb .sep{color:#ccc;}
.month-card{background:#fff;border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;}
.month-card:hover .month-head{background:#1a1a1a;}
.month-head{background:var(--black);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.month-head-left{color:#fff;font-weight:700;font-size:16px;}.month-head-sub{color:#aaa;font-size:12px;font-weight:400;margin-top:1px;}
.month-head-right{display:flex;align-items:center;gap:10px;}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;gap:4px;}
.tag-red{background:var(--red);color:#fff;}.tag-green{background:var(--green);color:#fff;}.tag-pink{background:var(--pink);color:#fff;}
.chevron{color:#fff;font-size:14px;margin-left:4px;}
.month-body{padding:16px 20px;}
.month-stats{display:flex;gap:28px;margin-bottom:12px;}
.stat{text-align:center;}.stat-val{font-size:20px;font-weight:800;}.stat-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.06em;}
.stat-val.s-grn{color:var(--green);}.stat-val.s-blu{color:var(--blue);}.stat-val.s-red{color:var(--red);}.stat-val.s-gry{color:#aaa;}
.progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-bar{flex:1;height:7px;background:var(--g2);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--pink);border-radius:4px;transition:width .4s;}
.progress-pct{font-size:12px;color:#888;white-space:nowrap;}
.week-card{background:#fff;border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;}
.week-card.current-week{border-left:4px solid var(--pink);}
.week-head{background:var(--black);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
.week-head-left{color:#fff;font-weight:700;font-size:14px;}.week-head-right{display:flex;align-items:center;gap:8px;}
.week-body{padding:14px 18px;display:flex;flex-wrap:wrap;gap:7px;}
.task-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--g2);}
.chip-andamento{background:#EEF4FF;color:var(--blue);border-color:#CCDCFF;}.chip-concluido{background:#E8F5EE;color:var(--green);border-color:#B3E6CF;}.chip-atrasado{background:#FFEEEE;color:var(--red);border-color:#FFCCCC;}.chip-nao{background:var(--g1);color:#888;}
.btn-back{background:none;border:1px solid var(--g2);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;color:#555;margin-bottom:16px;}.btn-back:hover{border-color:var(--pink);color:var(--pink);}
.day-group{margin-bottom:20px;}
.day-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--g2);}
.task-row{background:#fff;border-radius:8px;padding:10px 16px;margin-bottom:8px;display:grid;grid-template-columns:78px 130px 1fr 178px 65px 145px 72px 82px;gap:8px;align-items:center;border-left:4px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.task-row.t-red{background:#FFF8F8;border-left-color:var(--red);}.task-row.t-yel{background:#FFFDF5;border-left-color:var(--yellow);}.task-row.t-grn{background:#F5FDF9;border-left-color:var(--green);}.task-row.t-done{opacity:.65;}
.task-id{font-size:11px;font-weight:700;color:#888;background:var(--g1);padding:2px 6px;border-radius:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.task-dom{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dom-credito{background:#EEF4FF;color:var(--blue);}.dom-capital{background:var(--pink-l);color:var(--pink);}.dom-liquidez{background:#E8F5EE;color:var(--green);}.dom-mercado{background:#FFF9E6;color:#B8860B;}.dom-operacional{background:#F0F0FF;color:#5B5BD6;}.dom-socioambiental{background:#E8F5EE;color:#2E7D32;}.dom-rsac{background:#FFF0E8;color:#C04000;}
.task-nome{font-size:13px;font-weight:500;}.task-resp{font-size:11px;color:#555;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.task-prior{font-size:11px;text-align:center;white-space:nowrap;}.task-status{font-size:11px;font-weight:600;text-align:center;white-space:nowrap;}
.task-pct-wrap{display:flex;flex-direction:column;gap:3px;align-items:center;}.task-pct-bar{height:4px;background:var(--g2);border-radius:2px;overflow:hidden;width:100%;}.task-pct-fill{height:100%;background:var(--pink);border-radius:2px;}.task-pct-num{font-size:11px;color:#888;text-align:center;}
.btn-done{background:none;border:1px solid var(--green);color:var(--green);padding:5px 8px;border-radius:6px;font-size:11px;cursor:pointer;display:block;margin:0 auto;width:100%;text-align:center;}.btn-done:hover{background:var(--green);color:#fff;}
/* TEAM PANEL */
.team-panel{background:#fff;border-radius:10px;padding:20px 22px;margin-top:20px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.team-panel h4{font-size:14px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--g2);}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.team-card{border:1px solid var(--g2);border-radius:8px;padding:14px;}
.team-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.team-email{font-size:11px;color:#888;margin-bottom:10px;}
.team-domains{display:flex;flex-wrap:wrap;gap:5px;}
.dom-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;}
/* ALERT PANEL */
.alert-panel{background:#fff;border-radius:10px;padding:20px 22px;margin-top:18px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.alert-panel h4{font-size:14px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--g2);}
.alert-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.alert-table th{text-align:left;padding:7px 10px;background:var(--g1);color:#555;font-weight:600;border-bottom:1px solid var(--g2);white-space:nowrap;overflow:hidden;}
.alert-table td{padding:8px 10px;border-bottom:1px solid var(--g2);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.alert-table td:nth-child(3){white-space:normal;color:var(--pink);font-weight:500;}
.alert-table th:nth-child(1),.alert-table td:nth-child(1){width:80px;}
.alert-table th:nth-child(2),.alert-table td:nth-child(2){width:130px;}
.alert-table th:nth-child(4),.alert-table td:nth-child(4){width:135px;}
.alert-table th:nth-child(5),.alert-table td:nth-child(5){width:90px;}
.alert-table th:nth-child(6),.alert-table td:nth-child(6){width:85px;}
.alert-table th:nth-child(7),.alert-table td:nth-child(7){width:55px;text-align:center;}
.alert-table tr:last-child td{border-bottom:none;}
.badge-atrasado{background:var(--red);color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;}
.badge-ok{background:var(--green);color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;}
.resp-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.resp-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--g2);font-size:12px;font-weight:600;cursor:pointer;background:#fff;transition:all .12s;}
.resp-btn.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.btn-send{background:var(--pink);color:#fff;border:none;padding:8px 18px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;margin-right:6px;}.btn-send:hover{background:var(--pink-d);}
.send-status{margin-top:12px;padding:10px 14px;border-radius:7px;font-size:13px;display:none;}
.send-status.info{background:#EEF4FF;color:var(--blue);border-left:3px solid var(--blue);}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center;}.overlay.open{display:flex;}
.modal{background:#fff;border-radius:12px;width:620px;max-width:96vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;}
.modal-head{background:var(--black);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{color:#fff;font-size:16px;}.modal-close{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;}.modal-close:hover{color:#fff;}
.modal-tabs{display:flex;border-bottom:1px solid var(--g2);background:var(--g1);}
.modal-tab{padding:11px 20px;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;}.modal-tab.active{color:var(--pink);border-bottom-color:var(--pink);}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}.form-row.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}.form-group label{font-size:12px;font-weight:600;color:#555;}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1px solid var(--g2);border-radius:7px;font-size:13px;outline:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--pink);}
.form-group textarea{resize:vertical;min-height:70px;}
.btn-save{background:var(--pink);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:4px;}.btn-save:hover{background:var(--pink-d);}
.ai-response{margin-top:12px;padding:12px;background:var(--g1);border-radius:8px;border-left:3px solid var(--pink);font-size:13px;display:none;}
.update-search{padding:9px 12px;border:1px solid var(--g2);border-radius:7px;font-size:13px;width:100%;margin-bottom:12px;outline:none;}
.update-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--g2);}
.update-id{font-size:11px;font-weight:700;color:#888;width:55px;}.update-nome{flex:1;font-size:12px;}
.update-pct{width:70px;padding:5px 8px;border:1px solid var(--g2);border-radius:5px;font-size:12px;text-align:center;outline:none;}
.update-status{font-size:11px;width:90px;text-align:right;}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--g2);}
.check-row input[type=checkbox]{accent-color:var(--pink);width:16px;height:16px;}
.check-nome{flex:1;font-size:12px;}.check-id{font-size:11px;color:#888;width:55px;}
.btn-conclude-all{background:var(--green);color:#fff;border:none;padding:9px 20px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:12px;}



/* ── MOBILE ─────────────────────────────────────────────────────────────────── */
@media(max-width:680px){
  /* topbar */
  .topbar{padding:0 14px;height:52px;}
  .topbar-title{font-size:14px;}
  .topbar-sub,.topbar-date{display:none;}
  .btn-new{padding:7px 12px;font-size:11px;}

  /* kpi: 2x2 grid */
  .kpi-bar{padding:10px 14px;flex-wrap:wrap;gap:0;}
  .kpi{flex:0 0 50%;border-right:none;border-bottom:1px solid var(--g2);}
  .kpi:nth-child(odd){border-right:1px solid var(--g2);}
  .kpi:last-child{border-bottom:none;}
  .kpi-val{font-size:22px;}
  .kpi-lbl{font-size:9px;}

  .main{padding:12px 14px;}

  /* month/week cards */
  .month-card,.week-card{margin-bottom:10px;}
  .month-header,.week-header{padding:12px 14px;}
  .month-body{padding:10px 14px;}
  .month-stats{gap:14px;}
  .week-body{padding:10px 14px;}

  /* task rows: horizontal scroll to preserve desktop layout */
  .day-group{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .task-row{min-width:700px;cursor:pointer;}
  .task-nome{cursor:pointer;}
  .task-nome.expanded{white-space:normal!important;overflow:visible!important;}

  /* alert panel: horizontal scroll */
  .alert-panel{padding:12px 14px;}
  .alert-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .alert-table{min-width:560px;font-size:11px;}
  .alert-table th,.alert-table td{padding:6px 8px;}
  /* keep tarefa column from making rows tall on mobile */
  .alert-table td:nth-child(3){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}

  /* team grid */
  .team-grid{grid-template-columns:1fr;}

  /* modal: bottom sheet */
  .overlay{align-items:flex-end;}
  .modal{width:100%;max-width:100%;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo-wrap">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
        <circle cx="20" cy="20" r="20" fill="#111111"/>
        <text x="12" y="29" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700" letter-spacing="-1">t</text>
        <circle cx="27" cy="29" r="3.2" fill="#E0007A"/>
      </svg>
    </div>
    <div><div class="topbar-title">Riscos e Capital</div><div class="topbar-sub">Painel de Tarefas · meutudo</div></div>
  </div>
  <div class="topbar-right">
    <div class="topbar-date" id="topbar-date"></div>
    <button class="btn-new" onclick="openModal()">+ Nova tarefa / Atualizar</button>
  </div>
</div>

<div class="kpi-bar">
  <div class="kpi"><div class="kpi-val total" id="kpi-total">0</div><div class="kpi-lbl">Total</div></div>
  <div class="kpi"><div class="kpi-val andamento" id="kpi-andamento">0</div><div class="kpi-lbl">Em Andamento</div></div>
  <div class="kpi"><div class="kpi-val atrasadas" id="kpi-atrasadas">0</div><div class="kpi-lbl">Atrasadas</div></div>
  <div class="kpi"><div class="kpi-val hoje" id="kpi-hoje">0</div><div class="kpi-lbl">Vence Hoje</div></div>
  <div class="kpi"><div class="kpi-val concluidas" id="kpi-concluidas">0</div><div class="kpi-lbl">Concluídas</div></div>
</div>

<div class="main">
  <div class="breadcrumb" id="breadcrumb">
    <span class="active" onclick="navMeses()">📅 Todos os meses</span>
  </div>
  <div id="view-container"></div>

  <!-- PAINEL EQUIPE -->
  <div class="team-panel">
    <h4>👥 Equipe — Responsáveis por Domínio</h4>
    <div class="team-grid" id="team-grid"></div>
  </div>

  <!-- PAINEL ALERTAS -->
  <div class="alert-panel">
    <h4>🔔 Alertas de Tarefas</h4>
    <div class="resp-filter" id="resp-filter"></div>
    <div class="alert-scroll"><table class="alert-table"><thead><tr><th>ID</th><th>Domínio</th><th>Tarefa</th><th>Responsável</th><th>Prazo</th><th>Situação</th><th>Dias</th></tr></thead>
    <tbody id="alert-tbody"></tbody></table></div>
    <div style="margin-top:14px">
      <button class="btn-send" onclick="sendDraftAlert()">✉️ Criar rascunho Gmail</button>
    </div>
    <div class="send-status" id="send-status"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-head"><h3>Gerenciar Tarefas</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-tabs">
      <div class="modal-tab active" onclick="switchTab(this,'tab-add')">Nova Tarefa</div>
      <div class="modal-tab" onclick="switchTab(this,'tab-update')">Atualizar</div>
      <div class="modal-tab" onclick="switchTab(this,'tab-conclude')">Concluir</div>
    </div>
    <div class="modal-body">
      <div id="tab-add">
        <div class="form-row"><div class="form-group full"><label>Tarefa *</label><input type="text" id="f-tarefa" placeholder="Descrição da entrega"></div></div>
        <div class="form-row">
          <div class="form-group"><label>Domínio *</label>
            <select id="f-dominio" onchange="updateRespByDomain()">
              <option value="">Selecione…</option>
              <option>Capital</option><option>Risco de Crédito</option><option>Risco de Mercado</option>
              <option>Risco Operacional</option><option>Risco de Liquidez</option><option>RSAC</option>
            </select>
          </div>
          <div class="form-group"><label>Responsável *</label>
            <select id="f-resp">
              <option value="">Selecione…</option>
              <option>Isabella Folegatti</option>
              <option>Thaís Hesse</option>
              <option>Davi Mathielo</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Prazo *</label><input type="date" id="f-prazo"></div>
          <div class="form-group"><label>Prioridade</label>
            <select id="f-prioridade"><option value="🟡 Média">🟡 Média</option><option value="🔴 Alta">🔴 Alta</option><option value="🟢 Baixa">🟢 Baixa</option></select>
          </div>
        </div>
        <div class="form-row"><div class="form-group full"><label>Projeto</label><input type="text" id="f-projeto" placeholder="Ex: ICAAP 2025"></div></div>
        <div class="form-row"><div class="form-group full"><label>Observações</label><textarea id="f-obs"></textarea></div></div>
        <button class="btn-save" onclick="saveTask()">Salvar Tarefa</button>
        <div class="ai-response" id="ai-response"></div>
      </div>
      <div id="tab-update" style="display:none">
        <input class="update-search" type="text" placeholder="Buscar tarefa…" oninput="renderUpdateList(this.value)">
        <div id="update-list"></div>
      </div>
      <div id="tab-conclude" style="display:none">
        <div id="conclude-list"></div>
        <button class="btn-conclude-all" onclick="concludeChecked()">✅ Marcar Selecionadas como Concluídas</button>
      </div>
    </div>
  </div>
</div>

<script>
const TODAY = new Date().toISOString().split('T')[0];

const PREFIXOS = {'Risco de Crédito':'CRD','Risco de Liquidez':'LIQ','Risco de Mercado':'MRC','Risco Operacional':'OPR','RSAC':'RSC','Capital':'CAP','Crédito':'CRD','Liquidez':'LIQ','Mercado':'MRC','Operacional':'OPR','Socioambiental':'RSC'};

// ─── RESPONSÁVEIS COM DOMÍNIOS ────────────────────────────────────────────────
const RESPONSAVEIS = {
  'Isabella Folegatti': {
    email: 'isabella.folegatti@meutudo.app',
    slack: '@isabella.folegatti',
    dominios: ['Capital','Risco de Crédito','Risco de Mercado','Risco Operacional','Risco de Liquidez','RSAC'],
  },
  'Thaís Hesse': {
    email: 'thais.hesse@meutudo.app',
    slack: '@thais.hesse',
    dominios: ['Risco Operacional','RSAC'],
  },
  'Davi Mathielo': {

function diasAte(p){return Math.ceil((new Date(p)-new Date(TODAY))/86400000);}
// Sempre exibe Isabella como co-responsável; para multi-domínio mostra todos
function displayResp(resp, dominios, soloResp){
  if(soloResp) return resp || 'Isabella Folegatti';
  const daviDoms  = new Set(['Capital','Risco de Crédito','Risco de Mercado','Risco de Liquidez']);
  const thaisDoms = new Set(['Risco Operacional','RSAC']);
  const doms = dominios || [];
  const temDavi  = doms.some(d => daviDoms.has(d));
  const temThais = doms.some(d => thaisDoms.has(d));
  if(temDavi && temThais) return 'Isabella + Davi + Thaís';
  if(!resp || resp==='Isabella Folegatti'){
    if(temDavi)  return 'Isabella + Davi';
    if(temThais) return 'Isabella + Thaís';
    return 'Isabella Folegatti';
  }
  return 'Isabella + ' + resp.split(' ')[0];
}
function monthLabel(y,m){const n=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return n[m-1]+'/'+y;}
function weekRange(year,week){const d=new Date(year,0,1+(week-1)*7);const day=d.getDay()||7;d.setDate(d.getDate()+1-day);const end=new Date(d);end.setDate(d.getDate()+6);const fmt=dd=>dd.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});return fmt(d)+'–'+fmt(end);}
function domClass(dom){const m={'Crédito':'credito','Risco de Crédito':'credito','Capital':'capital','Liquidez':'liquidez','Risco de Liquidez':'liquidez','Mercado':'mercado','Risco de Mercado':'mercado','Operacional':'operacional','Risco Operacional':'operacional','Socioambiental':'socioambiental','RSAC':'rsac'};return 'dom-'+(m[dom]||'capital');}
function chipClass(s){if(s.includes('Concluído')||s.includes('Aderente'))return 'chip-concluido';if(s.includes('andamento'))return 'chip-andamento';if(s.includes('Atrasado'))return 'chip-atrasado';return 'chip-nao';}
function rowClass(t){if(t.status.includes('Concluído'))return 't-grn t-done';if(t.status.includes('Aderente'))return 't-grn';const d=diasAte(t.prazo);if(d<0)return 't-red';if(d===0)return 't-yel';return '';}

function refreshKPIs(){
  let total=0,and=0,atras=0,hoje=0,conc=0;
  state.tasks.forEach(t=>{total++;if(t.status.includes('Concluído')||t.status.includes('Aderente')){conc++;return;}const d=diasAte(t.prazo);if(d<0)atras++;else if(d===0)hoje++;if(t.status.includes('andamento'))and++;});
  document.getElementById('kpi-total').textContent=total;
  document.getElementById('kpi-andamento').textContent=and;
  document.getElementById('kpi-atrasadas').textContent=atras;
  document.getElementById('kpi-hoje').textContent=hoje;
  document.getElementById('kpi-concluidas').textContent=conc;
}

function navMeses(){state.view='months';state.currentMonth='';state.currentWeek='';refreshBreadcrumb();renderMonths();}

function renderMonths(){
  const groups={};
  // Aderente tasks (prazo 2099) ficam fora do calendário
  state.tasks.filter(t=>!t.status.includes('Aderente')).forEach(t=>{const k=t.prazo.slice(0,7);if(!groups[k])groups[k]=[];groups[k].push(t);});
  const keys=Object.keys(groups).sort();
  let html='';
  keys.forEach(k=>{
    const ts=groups[k];const[y,m]=k.split('-').map(Number);const label=monthLabel(y,m);
    let conc=0,atras=0,and=0;
    ts.forEach(t=>{if(t.status.includes('Concluído'))conc++;else if(diasAte(t.prazo)<0)atras++;if(t.status.includes('andamento'))and++;});
    const pct=ts.length?Math.round(conc/ts.length*100):0;
    const tagHtml=atras>0?`<span class="tag tag-red">🔴 ${atras} atrasada${atras>1?'s':''}</span>`:`<span class="tag tag-green">✅ sem atrasos</span>`;
    html+=`<div class="month-card" onclick="navWeeks('${k}','${label}')">
      <div class="month-head"><div class="month-head-left">${label}<div class="month-head-sub">${ts.length} tarefa${ts.length!==1?'s':''}</div></div>
      <div class="month-head-right">${tagHtml}<span class="chevron">›</span></div></div>
      <div class="month-body"><div class="month-stats">
        <div class="stat"><div class="stat-val s-grn">${conc}</div><div class="stat-lbl">Concluídas</div></div>
        <div class="stat"><div class="stat-val s-blu">${and}</div><div class="stat-lbl">Andamento</div></div>
        <div class="stat"><div class="stat-val s-red">${atras}</div><div class="stat-lbl">Atrasadas</div></div>
        <div class="stat"><div class="stat-val s-gry">${ts.length-conc-and}</div><div class="stat-lbl">Não inic.</div></div>
      </div>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-pct">${pct}% concluído</div></div>
      </div></div>`;
  });
  // Bloco especial para tarefas Aderentes
  const aderentes=state.tasks.filter(t=>t.status.includes('Aderente'));
  if(aderentes.length){
    const chips=aderentes.map(t=>`<span class="task-chip chip-concluido">${t.dominio} — ${t.tarefa.slice(0,40)}${t.tarefa.length>40?'…':''}</span>`).join('');
    html+=`<div class="month-card" style="cursor:default">
      <div class="month-head" style="background:#00A86B"><div class="month-head-left">✅ Aderente<div class="month-head-sub">${aderentes.length} domínio${aderentes.length!==1?'s':''} já adequado${aderentes.length!==1?'s':''}</div></div>
      <div class="month-head-right"><span class="tag tag-green">sem prazo</span></div></div>
      <div class="month-body" style="display:flex;flex-wrap:wrap;gap:7px">${chips}</div></div>`;
  }
  document.getElementById('view-container').innerHTML=html;
}

function navWeeks(mk,ml){if(mk){state.currentMonth=ml;state.currentMonthKey=mk;}state.view='weeks';state.currentWeek='';refreshBreadcrumb();renderWeeks();}

function renderWeeks(){
  const mk=state.currentMonthKey;
  const tasks=state.tasks.filter(t=>t.prazo.startsWith(mk));
  const groups={};
  tasks.forEach(t=>{const d=new Date(t.prazo);const day=d.getDay()||7;d.setDate(d.getDate()+4-day);const ys=new Date(d.getFullYear(),0,1);const wk=Math.ceil((((d-ys)/86400000)+1)/7);const key=d.getFullYear()+'-W'+String(wk).padStart(2,'0');if(!groups[key])groups[key]={week:wk,year:d.getFullYear(),tasks:[]};groups[key].tasks.push(t);});
  const tw=(()=>{const d=new Date(TODAY);const day=d.getDay()||7;d.setDate(d.getDate()+4-day);const ys=new Date(d.getFullYear(),0,1);return Math.ceil((((d-ys)/86400000)+1)/7);})();
  const ty=new Date().getFullYear();
  let html=`<button class="btn-back" onclick="navMeses()">‹ Voltar</button>`;
  Object.keys(groups).sort().forEach(k=>{
    const g=groups[k];const isCurrent=g.week===tw&&g.year===ty;
    const chips=g.tasks.map(t=>`<span class="task-chip ${chipClass(t.status)}">${t.id} ${t.tarefa.slice(0,28)}${t.tarefa.length>28?'…':''}</span>`).join('');
    const atrasN=g.tasks.filter(t=>diasAte(t.prazo)<0&&!t.status.includes('Concluído')).length;
    html+=`<div class="week-card${isCurrent?' current-week':''}" onclick="navDays('${k}',${g.week})">
      <div class="week-head"><div class="week-head-left">Semana ${g.week} · ${weekRange(g.year,g.week)}</div>
      <div class="week-head-right">${isCurrent?'<span class="tag tag-pink">Semana atual</span>':''} ${atrasN>0?`<span class="tag tag-red">${atrasN} atrasada${atrasN>1?'s':''}</span>`:''}
      <span class="chevron">›</span></div></div>
      <div class="week-body">${chips}</div></div>`;
  });
  document.getElementById('view-container').innerHTML=html;
}

function navDays(weekKey,weekNum){state.view='days';state.currentWeek=weekNum;refreshBreadcrumb();renderDays(weekKey);}

// ─── URGÊNCIA POR PRAZO ────────────────────────────────────────────────
function pctDiasHtml(t){
  if(t.status.includes('Aderente')||t.status.includes('Concluído'))
    return '<div class="task-pct-wrap"><div class="task-pct-bar"><div class="task-pct-fill" style="width:100%;background:var(--green)"></div></div><div class="task-pct-num" style="color:var(--green)">✅</div></div>';
  const d=diasAte(t.prazo);
  if(d<0){
    const fill=Math.min(100,Math.abs(d)*5);
    return `<div class="task-pct-wrap"><div class="task-pct-bar"><div class="task-pct-fill" style="width:${fill}%;background:var(--red)"></div></div><div class="task-pct-num" style="color:var(--red);font-weight:700">${d}d</div></div>`;
  }
  const pct=Math.max(4,Math.min(96,Math.round((1-d/200)*100)));
  const color=d<=14?'var(--red)':d<=45?'var(--yellow)':'var(--green)';
  const numColor=d<=14?'var(--red)':d<=45?'#B8860B':'var(--green)';
  return `<div class="task-pct-wrap"><div class="task-pct-bar"><div class="task-pct-fill" style="width:${pct}%;background:${color}"></div></div><div class="task-pct-num" style="color:${numColor}">${d}d</div></div>`;
}

function renderDays(weekKey){
  const tasks=state.tasks.filter(t=>{const d=new Date(t.prazo);const day=d.getDay()||7;d.setDate(d.getDate()+4-day);const ys=new Date(d.getFullYear(),0,1);const wk=Math.ceil((((d-ys)/86400000)+1)/7);return d.getFullYear()+'-W'+String(wk).padStart(2,'0')===weekKey;});
  const groups={};const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  tasks.forEach(t=>{if(!groups[t.prazo])groups[t.prazo]=[];groups[t.prazo].push(t);});
  let html=`<button class="btn-back" onclick="navWeeks()">‹ Voltar</button>`;
  Object.keys(groups).sort().forEach(day=>{
    const d=new Date(day+'T12:00:00');
    const dl=dias[d.getDay()]+' · '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    const rows=groups[day].map(t=>`<div class="task-row ${rowClass(t)}" id="row-${t.id}" onclick="toggleTaskNome(this)">
      <div class="task-id">${t.id}</div><div class="task-dom ${domClass(t.dominio)}" title="${t.dominios?t.dominios.join(', '):t.dominio}">${t.dominios&&t.dominios.length>1?t.dominio.split(' ').slice(-1)[0]+' +'+(t.dominios.length-1):t.dominio}</div>
      <div class="task-nome">${t.tarefa}<span class="expand-hint">▼</span></div><div class="task-resp">${displayResp(t.responsavel,t.dominios,t.soloResp)}</div>
      <div class="task-prior">${t.prioridade}</div><div class="task-status">${t.status}</div>
      ${pctDiasHtml(t)}
      ${t.status.includes('Concluído')||t.status.includes('Aderente')?'<span style="font-size:18px">✅</span>':`<button class="btn-done" onclick="event.stopPropagation();concludeTask('${t.id}')">✅ Concluir</button>`}
    </div>`).join('');
    html+=`<div class="day-group"><div class="day-label">${dl}</div>${rows}</div>`;
  });
  document.getElementById('view-container').innerHTML=html;
}

function concludeTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status='✅ Concluído';t.pct=100;refreshKPIs();
  const row=document.getElementById('row-'+id);
  if(row){row.className='task-row t-grn t-done';row.querySelector('.task-status').textContent='✅ Concluído';const pctWrap=row.querySelector('.task-pct-wrap');if(pctWrap)pctWrap.outerHTML='<div class="task-pct-wrap"><div class="task-pct-bar"><div class="task-pct-fill" style="width:100%;background:var(--green)"></div></div><div class="task-pct-num" style="color:var(--green)">✅</div></div>';row.querySelector('.btn-done').outerHTML='<span style="font-size:18px">✅</span>';}
  refreshAlertPanel();
}

// ─── TEAM PANEL ─────────────────────────────────────────────────────
const domColors = {
  'Capital':'background:#FFE6F3;color:#E0007A',
  'Risco de Crédito':'background:#EEF4FF;color:#1D6FE8',
  'Risco de Mercado':'background:#FFF9E6;color:#B8860B',
  'Risco Operacional':'background:#F0F0FF;color:#5B5BD6',
  'Risco de Liquidez':'background:#E8F5EE;color:#00A86B',
  'RSAC':'background:#FFF0E8;color:#C04000',
  'Crédito':'background:#EEF4FF;color:#1D6FE8',
  'Liquidez':'background:#E8F5EE;color:#00A86B',
  'Mercado':'background:#FFF9E6;color:#B8860B',
  'Operacional':'background:#F0F0FF;color:#5B5BD6',
  'Socioambiental':'background:#E8F8EF;color:#2E7D32',
};

function renderTeamPanel(){
  const html=Object.entries(RESPONSAVEIS).map(([name,info])=>{
    const badges=info.dominios.map(d=>`<span class="dom-badge" style="${domColors[d]||''}">${d}</span>`).join('');
    return `<div class="team-card">
      <div class="team-name">${name}</div>
      <div class="team-email">${info.email}</div>
      <div class="team-domains">${badges}</div>
    </div>`;
  }).join('');
  document.getElementById('team-grid').innerHTML=html;
}

// ─── ALERT PANEL ─────────────────────────────────────────────────
function renderRespFilter(){
  const names=['Todos',...Object.keys(RESPONSAVEIS)];
  const html=names.map(n=>`<button class="resp-btn${state.alertFilter===n?' active':''}" onclick="setAlertFilter('${n}')">${n}</button>`).join('');
  document.getElementById('resp-filter').innerHTML=html;
}

function setAlertFilter(name){state.alertFilter=name;renderRespFilter();refreshAlertPanel();}

function refreshAlertPanel(){
  const tasks=state.tasks.filter(t=>{
    if(t.status.includes('Concluído')||t.status.includes('Aderente'))return false;
    if(state.alertFilter==='Todos')return true;
    const taskDomains=t.dominios||[t.dominio];
    return t.responsavel===state.alertFilter||taskDomains.some(d=>alertRecipientsForDomain(d).includes(state.alertFilter));
  });
  document.getElementById('alert-tbody').innerHTML=tasks.map(t=>{
    const d=diasAte(t.prazo);
    let badge='';
    if(d<0)badge=`<span class="badge-atrasado">🔴 ${Math.abs(d)}d atrasada</span>`;
    else if(d===0)badge='<span style="background:#F59E0B;color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">🟠 Hoje</span>';
    else if(d<=3)badge=`<span style="background:#F59E0B;color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700">🟡 Em ${d}d</span>`;
    else badge=`<span class="badge-ok">✅ ${d}d</span>`;
    const prazoPtBR=t.prazo==='2099-12-31'?'Aderente':new Date(t.prazo+'T12:00:00').toLocaleDateString('pt-BR');
    const dominioLabel=t.dominios&&t.dominios.length>1?t.dominios[0]+' +'+(t.dominios.length-1):t.dominio;
    const diasR=diasAte(t.prazo);const diasLabel=t.status.includes('Concluído')||t.status.includes('Aderente')?'✅':(diasR<0?`<span style="color:var(--red);font-weight:700">${diasR}d</span>`:`${diasR}d`);
    return `<tr><td><b>${t.id}</b></td><td>${dominioLabel}</td><td>${t.tarefa}</td><td>${displayResp(t.responsavel,t.dominios,t.soloResp)}</td><td>${prazoPtBR}</td><td>${badge}</td><td style="text-align:center">${diasLabel}</td></tr>`;
  }).join('');
}

function sendDraftAlert(){
  const st=document.getElementById('send-status');
  st.className='send-status info';st.style.display='block';
  st.textContent='✉️ Rascunho criado no Gmail — abra seus Rascunhos para enviar.';
}

// ─── MODAL ────────────────────────────────────────────────────────────────────────────────
function openModal(){document.getElementById('overlay').classList.add('open');renderUpdateList('');renderConcludeList();}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('overlay'))closeModal();}
function switchTab(el,tabId){document.querySelectorAll('.modal-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');['tab-add','tab-update','tab-conclude'].forEach(id=>{document.getElementById(id).style.display=id===tabId?'block':'none';});}

function updateRespByDomain(){
  const dom=document.getElementById('f-dominio').value;
  const resp=document.getElementById('f-resp');
  const suggested=dom?alertRecipientsForDomain(dom):Object.keys(RESPONSAVEIS);
  if(suggested.length===1)resp.value=suggested[0];
}

function saveTask(){
  const tarefa=document.getElementById('f-tarefa').value.trim();const dominio=document.getElementById('f-dominio').value;const resp=document.getElementById('f-resp').value;const prazo=document.getElementById('f-prazo').value;const prioridade=document.getElementById('f-prioridade').value;const projeto=document.getElementById('f-projeto').value.trim();const obs=document.getElementById('f-obs').value.trim();
  if(!tarefa||!dominio||!resp||!prazo){alert('Preencha os campos obrigatórios.');return;}
  const prefix=PREFIXOS[dominio]||'XX';const existing=state.tasks.filter(t=>t.id.startsWith(prefix+'-')).length;const id=prefix+'-'+String(existing+1).padStart(3,'0');
  const dd=diasAte(prazo);const status=dd<0?'🔴 Atrasado':'⬜ Não iniciado';
  state.tasks.push({id,dominio,projeto,tarefa,responsavel:resp,prazo,status,pct:0,prioridade,obs});
  refreshKPIs();if(state.view==='months')renderMonths();refreshAlertPanel();
  document.getElementById('f-tarefa').value='';document.getElementById('f-dominio').value='';document.getElementById('f-resp').value='';document.getElementById('f-prazo').value='';document.getElementById('f-obs').value='';
  const aiDiv=document.getElementById('ai-response');aiDiv.style.display='block';aiDiv.textContent='✅ Tarefa '+id+' registrada! Prazo: '+new Date(prazo+'T12:00:00').toLocaleDateString('pt-BR')+'.';
}

function renderUpdateList(q=''){
  const tasks=state.tasks.filter(t=>!t.status.includes('Concluído')&&!t.status.includes('Aderente')&&(t.id+t.tarefa+t.responsavel).toLowerCase().includes(q.toLowerCase()));
  document.getElementById('update-list').innerHTML=tasks.map(t=>`<div class="update-row"><span class="update-id">${t.id}</span><span class="update-nome">${t.tarefa}</span><input class="update-pct" type="number" min="0" max="100" value="${t.pct}" onchange="updatePct('${t.id}',this.value)"><span class="update-status" id="ustatus-${t.id}">${t.status}</span></div>`).join('')
    ||'<p style="color:#aaa;font-size:13px;padding:12px 0">Nenhuma tarefa ativa.</p>';
}

function updatePct(id,val){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;const pct=Math.min(100,Math.max(0,parseInt(val)||0));t.pct=pct;
  if(pct===100)t.status='✅ Concluído';else if(pct>0)t.status='🔵 Em andamento';else t.status='⬜ Não iniciado';
  const sp=document.getElementById('ustatus-'+id);if(sp)sp.textContent=t.status;
  refreshKPIs();if(state.view==='months')renderMonths();
}

function renderConcludeList(){
  const tasks=state.tasks.filter(t=>!t.status.includes('Concluído')&&!t.status.includes('Aderente'));
  document.getElementById('conclude-list').innerHTML=tasks.map(t=>`<div class="check-row"><input type="checkbox" id="chk-${t.id}"><span class="check-id">${t.id}</span><span class="check-nome">${t.tarefa}</span><span style="font-size:11px;color:#888">${t.prazo==='2099-12-31'?'—':new Date(t.prazo+'T12:00:00').toLocaleDateString('pt-BR')}</span></div>`).join('')
    ||'<p style="color:#aaa;font-size:13px;padding:12px 0">Nenhuma tarefa pendente.</p>';
}

function concludeChecked(){
  document.querySelectorAll('#conclude-list input[type=checkbox]:checked').forEach(cb=>{const id=cb.id.replace('chk-','');const t=state.tasks.find(x=>x.id===id);if(t){t.status='✅ Concluído';t.pct=100;}});
  refreshKPIs();if(state.view==='months')renderMonths();renderConcludeList();
}


// ─── MOBILE EXPAND ─────────────────────────────────────────────────────────────
function toggleTaskNome(rowEl){
  const nome = rowEl.querySelector('.task-nome');
  if(!nome) return;
  nome.classList.toggle('expanded');
  const hint = rowEl.querySelector('.expand-hint');
  if(hint) hint.textContent = nome.classList.contains('expanded') ? '▲' : '▼';
}

// ─── INIT ──────────────────────────────────────────────────────────────────────────────
function init(){
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).replace(',','');
  state.tasks.forEach(t=>{if(!t.status.includes('Concluído')&&diasAte(t.prazo)<0&&!t.status.includes('Atrasado'))t.status='🔴 Atrasado';});
  refreshKPIs();renderMonths();renderTeamPanel();renderRespFilter();refreshAlertPanel();
}
init();
</script>
</body>
</html>
